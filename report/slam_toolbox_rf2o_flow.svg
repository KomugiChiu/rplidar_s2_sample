<svg xmlns="http://www.w3.org/2000/svg" width="1020" height="560" font-family="sans-serif">
  <defs>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <path d="M0,0 L9,3 L0,6" fill="none" stroke="#333" stroke-width="1.5"/>
    </marker>
    <marker id="arr-dash" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <path d="M0,0 L9,3 L0,6" fill="none" stroke="#999" stroke-width="1.5"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="1020" height="560" fill="#fff" stroke="#ccc"/>

  <text x="510" y="28" text-anchor="middle" font-size="18" font-weight="bold">slam_toolbox + rf2o 資料流（RPLIDAR S2）</text>

  <!-- nodes -->
  <rect x="20" y="220" width="130" height="60" rx="8" fill="#e8f4ff" stroke="#333"/>
  <text x="85" y="255" text-anchor="middle" font-size="13" font-weight="bold">RPLIDAR S2</text>

  <rect x="190" y="220" width="140" height="60" rx="8" fill="#ffecec" stroke="#333"/>
  <text x="260" y="244" text-anchor="middle" font-size="13" font-weight="bold">rplidar_node</text>
  <text x="260" y="262" text-anchor="middle" font-size="11">SDK 解包 10Hz</text>

  <rect x="370" y="220" width="150" height="60" rx="20" fill="#fff7cc" stroke="#333"/>
  <text x="445" y="244" text-anchor="middle" font-size="13" font-weight="bold">/scan</text>
  <text x="445" y="262" text-anchor="middle" font-size="11">LaserScan frame=laser</text>

  <rect x="580" y="110" width="170" height="60" rx="8" fill="#ffecec" stroke="#333"/>
  <text x="665" y="134" text-anchor="middle" font-size="13" font-weight="bold">rf2o_laser_odometry</text>
  <text x="665" y="152" text-anchor="middle" font-size="11">訂 /scan 算位姿</text>

  <rect x="580" y="300" width="170" height="70" rx="8" fill="#ffecec" stroke="#333"/>
  <text x="665" y="324" text-anchor="middle" font-size="13" font-weight="bold">slam_toolbox</text>
  <text x="665" y="342" text-anchor="middle" font-size="11">訂 /scan + 查 TF</text>
  <text x="665" y="357" text-anchor="middle" font-size="11">建圖 + 迴環</text>

  <rect x="580" y="430" width="170" height="60" rx="8" fill="#f0f0f0" stroke="#333"/>
  <text x="665" y="454" text-anchor="middle" font-size="13" font-weight="bold">static_tf</text>
  <text x="665" y="472" text-anchor="middle" font-size="11">base→laser z=0.2</text>

  <rect x="800" y="60" width="190" height="50" rx="20" fill="#fff7cc" stroke="#333" stroke-dasharray="5,4"/>
  <text x="895" y="90" text-anchor="middle" font-size="12">/odom_rf2o</text>

  <rect x="800" y="125" width="190" height="50" rx="8" fill="#eaffea" stroke="#333"/>
  <text x="895" y="145" text-anchor="middle" font-size="12" font-weight="bold">TF: odom→base_footprint</text>
  <text x="895" y="162" text-anchor="middle" font-size="11">dynamic（命脈）</text>

  <rect x="800" y="290" width="190" height="70" rx="20" fill="#fff7cc" stroke="#333"/>
  <text x="895" y="312" text-anchor="middle" font-size="13" font-weight="bold">/map + TF: map→odom</text>
  <text x="895" y="330" text-anchor="middle" font-size="11">OccupancyGrid 5cm</text>
  <text x="895" y="345" text-anchor="middle" font-size="11">map→odom 20Hz</text>

  <rect x="800" y="430" width="190" height="60" rx="8" fill="#f0f0f0" stroke="#333"/>
  <text x="895" y="454" text-anchor="middle" font-size="13" font-weight="bold">map_saver_cli</text>
  <text x="895" y="472" text-anchor="middle" font-size="11">pgm + yaml</text>

  <!-- edges -->
  <line x1="150" y1="250" x2="188" y2="250" stroke="#333" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="330" y1="250" x2="368" y2="250" stroke="#333" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- /scan split -->
  <line x1="520" y1="240" x2="580" y2="140" stroke="#333" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="520" y1="260" x2="578" y2="320" stroke="#333" stroke-width="2" marker-end="url(#arr)"/>

  <!-- rf2o outputs -->
  <path d="M 750 125 L 775 125 L 775 85 L 800 85" fill="none" stroke="#999" stroke-width="1.5" stroke-dasharray="5,4" marker-end="url(#arr-dash)"/>
  <line x1="750" y1="150" x2="800" y2="150" stroke="#333" stroke-width="2" marker-end="url(#arr)"/>
  <text x="758" y="144" font-size="11" font-weight="bold">TF</text>

  <!-- TF into toolbox -->
  <path d="M 800 160 L 775 160 L 775 320 L 750 320" fill="none" stroke="#333" stroke-width="2" marker-end="url(#arr)"/>
  <text x="782" y="245" font-size="11">odom→base 給初估</text>

  <line x1="665" y1="430" x2="665" y2="370" stroke="#333" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="672" y="405" font-size="11">base→laser</text>

  <!-- toolbox to map -->
  <line x1="750" y1="335" x2="800" y2="335" stroke="#333" stroke-width="2" marker-end="url(#arr)"/>

  <!-- map to saver -->
  <line x1="895" y1="360" x2="895" y2="428" stroke="#333" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="902" y="398" font-size="11">訂 /map 存檔</text>

  <!-- TF tree footer -->
  <text x="510" y="530" text-anchor="middle" font-size="13">TF 樹：map → odom（toolbox） → base_footprint（rf2o） → laser（static）</text>
</svg>
